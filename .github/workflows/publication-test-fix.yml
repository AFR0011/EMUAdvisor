name: One-time publication test cleanup

on:
  push:
    branches:
      - publication/portfolio-release
    paths:
      - .github/workflows/publication-test-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publication/portfolio-release
      - name: Replace legacy URL-token server test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_server_logging_load.py")
          text = path.read_text(encoding="utf-8")
          old = '        allowed_admin = client.get("/admin?admin_token=secret")\n'
          new = '''        query_token_ask = client.post(\n            "/ask",\n            params={"admin_token": "secret"},\n            json={"question": "What is the attendance requirement?", "answer_style": "extractive"},\n        )\n        allowed_admin = client.get("/admin")\n'''
          if old not in text:
              raise SystemExit("legacy admin URL test line not found")
          text = text.replace(old, new, 1)
          old_assert = '        self.assertEqual(allowed_metrics.status_code, 200)\n        self.assertEqual(allowed_admin.status_code, 200)\n'
          new_assert = '        self.assertEqual(allowed_metrics.status_code, 200)\n        self.assertEqual(query_token_ask.status_code, 401)\n        self.assertEqual(allowed_admin.status_code, 200)\n'
          if old_assert not in text:
              raise SystemExit("legacy admin assertion block not found")
          text = text.replace(old_assert, new_assert, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/publication-test-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: verify URL query tokens do not authenticate admin APIs"
          git push
