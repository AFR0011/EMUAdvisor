name: One-time publication CI fixes

on:
  push:
    branches:
      - publication/portfolio-release
    paths:
      - .github/workflows/publication-ci-fixes.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publication/portfolio-release
      - name: Apply targeted publication fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Server: headers only for admin credentials.
          server = Path("emu_advisor/server.py")
          text = server.read_text(encoding="utf-8")
          old = '''    query_token = request.query_params.get("admin_token")\n    if query_token:\n        return query_token.strip()\n    return None\n'''
          new = '''    return None\n'''
          if old not in text:
              raise SystemExit("server query-token block not found")
          server.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 2) Gold-set unit test: verified metadata is now the contract.
          test_eval = Path("tests/test_ingestion_routing_evaluation.py")
          text = test_eval.read_text(encoding="utf-8")
          old = '        self.assertEqual({case.review_status for case in cases}, {"assistant_curated_pending_human_review"})\n'
          new = '''        self.assertEqual({case.review_status for case in cases}, {"human_reviewed_verified"})\n        self.assertTrue(all(case.is_correct is True for case in cases))\n        self.assertTrue(all(case.citation_ok is True for case in cases))\n'''
          if old not in text:
              raise SystemExit("legacy gold review assertion not found")
          test_eval.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 3) Browser smoke: establish scroll baseline after Playwright has made Send visible.
          smoke = Path("tools/browser_smoke.py")
          text = smoke.read_text(encoding="utf-8")
          old = '''    send = page.locator("#user-send")\n    page_y_before = page.evaluate("window.scrollY")\n    send.click()\n'''
          new = '''    send = page.locator("#user-send")\n    send.scroll_into_view_if_needed()\n    page_y_before = page.evaluate("window.scrollY")\n    send.click()\n'''
          if old not in text:
              raise SystemExit("browser scroll baseline block not found")
          smoke.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/publication-ci-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align publication tests and admin authentication"
          git push
