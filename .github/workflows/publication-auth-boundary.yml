name: One-time admin auth boundary fix

on:
  push:
    branches:
      - publication/portfolio-release
    paths:
      - .github/workflows/publication-auth-boundary.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publication/portfolio-release
      - name: Keep admin shell reachable while protecting diagnostic APIs
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("emu_advisor/server.py")
          text = path.read_text(encoding="utf-8")
          old = '    protected_exact = {"/admin", "/ask", "/metrics", "/metrics/modes", "/analytics", "/corpus/status"}\n'
          new = '    protected_exact = {"/ask", "/metrics", "/metrics/modes", "/analytics", "/corpus/status"}\n'
          if old not in text:
              raise SystemExit("protected endpoint set not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/publication-auth-boundary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep admin shell reachable for header authentication"
          git push
