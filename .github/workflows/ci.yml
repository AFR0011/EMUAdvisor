name: EMUAdvisor CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  EMU_ADVISOR_PROFILE: test
  EMU_ADVISOR_CORPUS_MODE: fixture
  EMU_ADVISOR_QUERY_REWRITE: deterministic
  EMU_ADVISOR_ENABLE_CHAT_PERSISTENCE: "0"
  EMU_ADVISOR_ENABLE_AUDIT_LOGGING: "0"
  EMU_ADVISOR_LOG_RAW_QUERY: "0"

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v6.0.0
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      # actions/setup-python v6.3.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-audit.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -r requirements-audit.txt
          python -m pip check
      - name: Syntax scan
        run: python tools/syntax_check.py
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Evaluation set validation
        run: |
          python -m emu_advisor.evaluation eval_sets/v1_gold.jsonl
          python -m emu_advisor.evaluation eval_sets/v1_hard.jsonl
          python -m emu_advisor.evaluation eval_sets/emu_gold_seed.jsonl
      - name: Evaluation review status
        run: python -m emu_advisor.eval_review status eval_sets/v1_gold.jsonl eval_sets/v1_hard.jsonl eval_sets/emu_gold_seed.jsonl
      - name: Publication guard
        run: python tools/publication_guard.py
      - name: Dependency audit
        run: python -m pip_audit -r requirements-lock.txt

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.0
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      # actions/setup-python v6.3.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m playwright install --with-deps chromium
      - name: Browser smoke
        run: python tools/browser_smoke.py --start-server
