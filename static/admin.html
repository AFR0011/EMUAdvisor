<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EMU Regulation Assistant Admin</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="admin-view">
    <main class="admin-shell">
      <header class="admin-header">
        <div>
          <p class="eyebrow">Admin console</p>
          <h1>EMU Regulation Assistant</h1>
        </div>
        <a class="admin-link" href="/">Public demo</a>
      </header>

      <section class="panel" aria-label="Ask a regulation question">
        <label for="question">Question</label>
        <textarea id="question" rows="4">What is the attendance requirement?</textarea>
        <div class="controls">
          <select id="mode" aria-label="Operating mode">
            <option value="cheap">Cheap</option>
            <option value="balanced" selected>Balanced</option>
            <option value="expensive">Expensive</option>
          </select>
          <select id="answer-style" aria-label="Answer style">
            <option value="both" selected>Extractive + LLM</option>
            <option value="extractive">Extractive only</option>
            <option value="generated">LLM answer</option>
          </select>
          <label class="check"><input id="cross" type="checkbox" /> Cross-corpus</label>
          <button id="ask" type="button">Ask</button>
        </div>
      </section>

      <section class="metrics" aria-label="Demo metrics">
        <article><span id="corpus-count">-</span><small>chunks</small></article>
        <article><span id="top5">-</span><small>top-5 retrieval</small></article>
        <article><span id="reject">-</span><small>rejection accuracy</small></article>
        <article><span id="latency">-</span><small>p50 extractive latency</small></article>
        <article><span id="llm-status">-</span><small>local LLM</small></article>
      </section>

      <section class="admin-grid">
        <article class="panel">
          <h2>Corpus and Runtime</h2>
          <dl id="corpus-details" class="detail-list"></dl>
        </article>
        <article class="panel">
          <h2>Mode Presets</h2>
          <div id="mode-details" class="mode-list"></div>
        </article>
      </section>

      <section class="result" aria-live="polite">
        <div id="status">Ready.</div>
        <pre id="answer"></pre>
        <div id="evidence-groups"></div>
        <pre id="generated"></pre>
        <div id="citations"></div>
        <details id="diagnostics">
          <summary>Diagnostics</summary>
          <pre id="diagnostic-json"></pre>
        </details>
      </section>
    </main>
    <script src="/static/admin.js"></script>
  </body>
</html>
